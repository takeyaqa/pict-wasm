name: Publish WebAssembly to npm registry
on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish-wasm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
      - uses: pnpm/setup@v3.1.2
        with:
          cache: true
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.13
      - run: pnpm run build
      - run: pnpm publish --tag latest --no-git-checks
