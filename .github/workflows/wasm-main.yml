name: Check and Build WebAssembly
on:
  pull_request:

env:
  PYTHON_VERSION: 3.13.3
  EMSDK_VERSION: 6.0.7

permissions:
  contents: read

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v3.1.2
        with:
          cache: true
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EMSDK_VERSION }}
      - run: pnpm run build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
  check:
    needs: build-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v3.1.2
        with:
          cache: true
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - run: pnpm run fmt:check
      - run: pnpm run lint
      - run: pnpm run typecheck
  test-node:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v3.1.2
        with:
          cache: true
          runtime: node@${{ matrix.node-version }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - run: pnpm run test:node
  test-browser:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v3.1.2
        with:
          cache: true
      - run: pnpm exec playwright install --with-deps
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - run: pnpm run test:browser
